<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>Vũ ♥ Quyên – Galaxy Love 3D</title>
<style>
:root {color-scheme:dark; --pink:#ff8ed5; --violet:#b58aff; --white:#fff0fb;}
*,*::before,*::after {box-sizing:border-box}
html,body {height:100%;width:100%;margin:0;overflow:hidden}
body {background:#080416;color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button {font:inherit;cursor:pointer}
button:focus-visible,.scene:focus-visible {outline:2px solid #ffd2f3;outline-offset:4px}
.universe {position:fixed;inset:0;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 56% 54% at 49% 49%,#2a124b 0%,#170a30 58%,transparent 99%),radial-gradient(ellipse 37% 45% at 22% 39%,#2e114b,transparent),radial-gradient(ellipse 42% 37% at 78% 57%,#361147,transparent),#080416}
canvas {position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none}
#sky {z-index:1} #fx {z-index:8}
.header {position:absolute;top:max(20px,env(safe-area-inset-top));left:0;right:0;z-index:10;text-align:center;pointer-events:none;padding:0 12px}
.kicker {font-size:10px;font-weight:750;letter-spacing:.28em;text-transform:uppercase;color:#f4c5eb}
.subtitle {margin-top:9px;font:italic 13px Georgia,serif;color:#cdbbe9}
.stage-wrap {position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none}
.scene {position:relative;width:min(94vw,700px,75svh);aspect-ratio:1;perspective:900px;perspective-origin:50% 50%;touch-action:none;cursor:grab;pointer-events:auto;outline:none;user-select:none;-webkit-user-select:none}
.scene:active {cursor:grabbing}
.halo {position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle,#ea3ba637 0%,#af55d924 46%,transparent 75%);animation:halo 6s ease-in-out infinite alternate;pointer-events:none}
.orbit {position:absolute;inset:13%;border:1px solid #c96efa20;border-radius:50%;transform:rotate(-28deg) scaleY(.72);pointer-events:none}
.orbit.two {inset:7%;border-color:#81d6ff1c;transform:rotate(34deg) scaleY(.72)}
.tilt {position:absolute;inset:0;transform:rotateX(0deg) rotateY(0deg);transform-style:preserve-3d;will-change:transform;pointer-events:none}
.beat {position:absolute;inset:0;transform-style:preserve-3d;animation:beat 2.6s ease-in-out infinite}
.depth,.heart-svg {position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.depth svg {width:100%;height:100%;display:block}
.depth.back {transform:translateZ(-45px) scale(1.035);opacity:.16}
.depth.mid {transform:translateZ(-19px) scale(1.015);opacity:.27}
.depth.front {transform:translateZ(3px);opacity:.19}
.depth.back path {fill:#9b54ee;stroke:#bf86ff;stroke-width:5}
.depth.mid path {fill:#e44bba;stroke:#ff8fdd;stroke-width:3}
.depth.front path {fill:#f36cc8;stroke:#ffc2eb;stroke-width:2}
.heart-svg {transform:translateZ(28px);filter:drop-shadow(0 0 5px #f342b361)}
.ring .outline {fill:none;stroke-width:1.1;opacity:.35}
.ring text {font:700 16px Arial,sans-serif;letter-spacing:.1px}
.ring-0 text {fill:#ffe9fb}.ring-0 .outline {stroke:#ff7ed0}
.ring-1 text {fill:#ff93d9}.ring-1 .outline {stroke:#f54dae}
.ring-2 text {fill:#dfc8ff}.ring-2 .outline {stroke:#a981ff}
.ring-3 text {fill:#ffc0ec}.ring-3 .outline {stroke:#ff6ab6}
.ring-4 text {fill:#a6e9ff}.ring-4 .outline {stroke:#7adcfb}
.center {position:absolute;left:50%;top:49%;z-index:5;width:54%;text-align:center;transform:translate3d(-50%,-50%,60px);pointer-events:none;backface-visibility:hidden}
.center::before {content:"";position:absolute;inset:-8% -7%;z-index:-1;border-radius:50%;background:radial-gradient(ellipse,#140922f7 0%,#140922ec 49%,#170d2cca 69%,transparent 90%)}
.forever {font-size:clamp(9px,1.5vw,13px);font-weight:750;letter-spacing:.23em;color:#fff0fa}
.names {margin:9px 0 6px;white-space:nowrap;letter-spacing:-.045em;font:italic 700 clamp(25px,5.5vw,50px)/1.15 Georgia,serif;text-shadow:0 0 9px #f968c5,0 0 20px #ee49b777}
.names span {font-size:.73em;color:#ff9dda}
.line {height:1px;width:75%;margin:10px auto;background:linear-gradient(90deg,transparent,#ffafeb,transparent)}
.message {margin:0;color:#ffd3f0;font-size:clamp(11px,2.5vw,18px);line-height:1.5;font-weight:700}
.message span {white-space:nowrap}
.center-heart {margin-top:3px;color:#ff8dd7;font-size:clamp(23px,4vw,35px);animation:tinybeat 1.6s ease-in-out infinite}
.hint {position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:max-content;max-width:96%;pointer-events:none;text-align:center;color:#d2b8e8;font-size:11px}
.words {position:absolute;z-index:9;inset:0;overflow:hidden;pointer-events:none}
.float-word {position:absolute;max-width:min(48vw,210px);white-space:nowrap;padding:6px 10px;border-radius:99px;color:#fff4fd;font:700 clamp(10px,2.5vw,13px) system-ui,sans-serif;background:#421a62c9;border:1px solid #ffa7e386;box-shadow:0 2px 10px #07031377;left:var(--x);top:var(--y);will-change:transform,opacity;animation:flywords var(--dur,1.9s) ease-out forwards}
.ripple {position:absolute;z-index:8;left:var(--x);top:var(--y);width:24px;height:24px;border:2px solid #ffadeb;border-radius:50%;pointer-events:none;animation:ripple .85s ease-out forwards}
.love-card {position:absolute;z-index:11;left:50%;bottom:112px;max-width:min(92vw,450px);width:max-content;min-width:min(82vw,290px);padding:12px 18px;border:1px solid #ffb5eb8c;border-radius:18px;background:#27123ff2;box-shadow:0 12px 35px #0009;color:#fff1fb;text-align:center;pointer-events:none;opacity:0;transform:translate(-50%,18px) scale(.96);transition:opacity .22s,transform .22s}
.love-card.show {opacity:1;transform:translate(-50%,0) scale(1)}
.love-card small {display:block;color:#fba5dc;letter-spacing:.12em;font-size:10px;text-transform:uppercase;font-weight:800}
.love-card strong {display:block;margin-top:5px;font-size:clamp(13px,3.2vw,18px);line-height:1.4}
.dock {position:absolute;z-index:15;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(96vw,560px)}
.controls {display:flex;gap:6px;background:#211035ed;border:1px solid #f2b6ed47;border-radius:19px;padding:7px}
.control {flex:1;min-width:0;display:flex;gap:6px;align-items:center;justify-content:center;padding:11px 4px;border:1px solid transparent;border-radius:12px;background:transparent;color:#efddf6;font-size:12px;font-weight:650}
.control:hover,.control[aria-pressed=true] {background:#f866bb1c;border-color:#ffa6e544}
.control:active {transform:scale(.98)}
.control .ico {font-size:16px;line-height:1}
.status {padding-top:6px;min-height:17px;color:#c9b8e2;text-align:center;font-size:10px}
.toast {position:absolute;left:50%;bottom:112px;z-index:30;max-width:90vw;min-width:230px;padding:11px 14px;border:1px solid #eda7e36a;border-radius:13px;background:#2d1647f0;color:#fff2fa;text-align:center;font-size:12px;pointer-events:none;opacity:0;transform:translate(-50%,12px);transition:opacity .18s,transform .18s}
.toast.show {opacity:1;transform:translate(-50%,0)}
@keyframes beat {0%,100%{transform:scale(1)}35%{transform:scale(1.03)}65%{transform:scale(1.012)}}
@keyframes tinybeat {0%,100%{transform:scale(1)}45%{transform:scale(1.15)}}
@keyframes halo {from{opacity:.52;transform:scale(.9)}to{opacity:1;transform:scale(1.12)}}
@keyframes ripple {from{opacity:.9;transform:translate(-50%,-50%) scale(.2)}to{opacity:0;transform:translate(-50%,-50%) scale(12)}}
@keyframes flywords {0%{opacity:0;transform:translate(-50%,-50%) scale(.48)}16%{opacity:1;transform:translate(calc(-50% + var(--hx)),calc(-50% + var(--hy))) scale(.94)}70%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.06)}}
body.lite .heart-svg {filter:none} body.lite .halo {animation:none}
body.paused .beat,body.paused .halo,body.paused .center-heart,body.paused .float-word,body.paused .ripple {animation-play-state:paused}
@media (max-width:600px) {
 .scene{width:min(104vw,520px,66svh)} .subtitle{font-size:12px}
 .forever{font-size:clamp(8px,2vw,10px);letter-spacing:.13em}.names{font-size:clamp(23px,6.4vw,35px);margin:6px 0}.line{margin:6px auto}
 .message{font-size:clamp(10px,2.7vw,13px)}.center-heart{font-size:26px}.hint{font-size:9px;bottom:2%}
 .controls{gap:3px;padding:6px;border-radius:16px}.control{font-size:10px;flex-direction:column;gap:3px;padding:8px 2px}.control .ico{font-size:16px}
 .love-card{bottom:110px;padding:10px 13px}
}
@media (max-height:620px) {
 .scene{width:min(84vw,73svh)}.header{top:6px}.subtitle{margin-top:3px}.hint{display:none}.dock{bottom:5px}.control{padding:6px 2px}
 .love-card{bottom:81px;max-width:min(90vw,400px)}
}
@media (prefers-reduced-motion:reduce) {
 body:not(.user-motion) .beat,body:not(.user-motion) .halo,body:not(.user-motion) .center-heart{animation:none!important}
}
</style>
</head>
<body class="lite">

 <div class="stage-wrap">

  <div class="status" id="status">Galaxy Love 3D · tối ưu cho PC và điện thoại</div>
 </footer>

<script>
(() => {
 'use strict';
 const $ = id => document.getElementById(id);
 const scene=$('scene'),tilt=$('tilt'),sky=$('sky'),fx=$('fx');
 const skyCtx=sky.getContext('2d'),fxCtx=fx.getContext('2d');
 const mobile=matchMedia('(pointer:coarse)').matches || innerWidth<650;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const state={lite:true,paused:false,hidden:document.hidden,w:0,h:0,dpr:1,
   fps:30,rx:0,ry:0,tx:0,ty:0,last:0,raf:0,sensorOn:false,sensorSeen:false,
   sensorZero:null,sensorAngle:null,audioOn:false,lastBurst:0};
 let stars=[],particles=[],resizeTimer=0,toastTimer=0,cardTimer=0,sensorTimer=0,rect=null;
 const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
 const rand=(a,b)=>a+Math.random()*(b-a);
 const wishes=[
   'Quyên ơi, Vũ yêu em nhiều hơn mọi vì sao! ✨',
   'Cảm ơn vợ Quyên đã xuất hiện trong cuộc đời anh. 💗',
   'Dù cả thiên hà đổi thay, Vũ vẫn chọn Quyên. 🌌',
   'Anh muốn nắm tay em đi qua mọi ngày bình yên. 🌷',
   'Vũ thương vợ Quyên nhiều ơi là nhiều! 💞',
   'Em là điều dịu dàng và đẹp nhất của anh. ♥',
   'Mong nụ cười của Quyên luôn rực rỡ như những vì sao. ✨',
   'Vũ hứa sẽ luôn trân trọng và yêu thương Quyên. 💖'
 ];
 const wordBits=['Yêu em ❤️','Vợ yêu ơi 💗','Vũ ♥ Quyên','Mãi bên nhau ✨','Thương em 💞','Mãi chọn em 🌷','Của riêng em 💖','Hạnh phúc nhé ✨'];
 let wishIndex=0;
 function heartD(scale){
   const pieces=[];
   for(let i=0;i<=168;i++){
     const t=i/168*Math.PI*2, x=16*Math.sin(t)**3;
     const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
     pieces.push((i?'L':'M')+(400+x*16.2*scale).toFixed(1)+' '+(393-y*16.2*scale).toFixed(1));
   }
   return pieces.join(' ')+' Z';
 }
 // Năm vòng chữ của thiết kế cũ, giản lược số điểm vẽ để nhẹ GPU.
 const phrase='Vũ yêu vợ Quyên nhìu lắm <3  ✧  ';
 const scales=[1.18,1.015,.86,.705,.55],sizes=[17.5,16,14.8,13.2,11.8];
 const measure=document.createElement('canvas').getContext('2d');
 scales.forEach((k,i)=>{
   const path=$('path'+i),t=$('text'+i);path.setAttribute('d',heartD(k));
   const length=path.getTotalLength();measure.font=`700 ${sizes[i]}px Arial`;
   const repeat=Math.max(1,Math.round(length/measure.measureText(phrase).width));
   t.textContent=phrase.repeat(repeat);
   t.setAttribute('textLength',Math.max(1,length-8).toFixed(1));t.setAttribute('lengthAdjust','spacing');
 });
 const coreD=heartD(.67);
 document.querySelectorAll('.core-path').forEach(p=>p.setAttribute('d',coreD));
 function toast(text){const node=$('toast');node.textContent=text;node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),2600)}
 function size(){
   state.w=innerWidth;state.h=innerHeight;
   // Tránh cấp phát canvas 4K trên máy màn hình DPI cao.
   state.dpr=Math.min(devicePixelRatio||1,state.lite?1:1.35);
   [sky,fx].forEach(c=>{c.width=Math.max(1,Math.floor(state.w*state.dpr));c.height=Math.max(1,Math.floor(state.h*state.dpr))});
   skyCtx&&skyCtx.setTransform(state.dpr,0,0,state.dpr,0,0);
   fxCtx&&fxCtx.setTransform(state.dpr,0,0,state.dpr,0,0);
   const n=state.lite?(state.w<600?54:75):(state.w<600?90:140);
   stars=Array.from({length:n},()=>({x:Math.random(),y:Math.random(),phase:rand(0,6.28),speed:rand(.25,.8),r:rand(.65,1.7),color:Math.random()}));
   rect=scene.getBoundingClientRect();particles.length=0;
 }
 function quality(){
   state.fps=state.lite?(mobile?25:30):(mobile?40:45);
   document.body.classList.toggle('lite',state.lite);
   document.body.classList.toggle('user-motion',!state.lite && reduced);
   $('qualityLabel').textContent=state.lite?'Chế độ nhẹ':'Hiệu ứng đẹp';
   $('qualityButton').setAttribute('aria-pressed',String(!state.lite));
   $('status').textContent='Galaxy Love 3D · '+(state.lite?'tiết kiệm pin':'hiệu ứng đẹp')+' · '+state.fps+' FPS tối đa';
   size();
 }
 function drawSky(t){
   if(!skyCtx)return;
   skyCtx.clearRect(0,0,state.w,state.h);
   const sec=t/1000;
   for(const st of stars){
     skyCtx.globalAlpha=.27+.5*(.5+.5*Math.sin(sec*st.speed*2+st.phase));
     skyCtx.fillStyle=st.color>.9?'#ffabeb':st.color>.78?'#b9c4ff':'#fff5fb';
     const x=(st.x*state.w+sec*st.speed*1.2)%state.w;
     skyCtx.fillRect(x,st.y*state.h,st.r,st.r);
   }
   skyCtx.globalAlpha=1;
 }
 function paintHeart(c,x,y,r){
   c.beginPath();c.moveTo(x,y+r*.4);
   c.bezierCurveTo(x-r*1.2,y-r*.4,x-r*.7,y-r*1.1,x,y-r*.5);
   c.bezierCurveTo(x+r*.7,y-r*1.1,x+r*1.2,y-r*.4,x,y+r*.4);
   c.closePath();c.fill();
 }
 function drawParticles(dt){
   if(!fxCtx || !particles.length)return;
   fxCtx.clearRect(0,0,state.w,state.h);
   for(let i=particles.length-1;i>=0;i--){
     const p=particles[i];p.age+=dt;
     if(p.age>=p.life){particles.splice(i,1);continue}
     p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=28*dt;
     fxCtx.globalAlpha=1-p.age/p.life;
     fxCtx.fillStyle=p.t>.68?'#a6e9ff':p.t>.3?'#ff97d8':'#fff2fd';
     if(p.heart)paintHeart(fxCtx,p.x,p.y,p.r);else fxCtx.fillRect(p.x,p.y,p.r*.7,p.r*.7);
   }
   fxCtx.globalAlpha=1;
   if(!particles.length)fxCtx.clearRect(0,0,state.w,state.h);
 }
 function popWords(x,y){
   const parent=$('words');
   while(parent.children.length>22)parent.firstChild.remove();
   const count=state.lite?4:6;
   for(let i=0;i<count;i++){
     const node=document.createElement('span'),angle=2*Math.PI*(i/count)+rand(-.24,.24);
     const distance=rand(state.w<600?68:90,state.w<600?123:177);
     node.className='float-word';node.textContent=wordBits[(wishIndex+i)%wordBits.length];
     node.style.setProperty('--x',x+'px');node.style.setProperty('--y',y+'px');
     node.style.setProperty('--dx',(Math.cos(angle)*distance).toFixed(0)+'px');
     node.style.setProperty('--dy',(Math.sin(angle)*distance-27).toFixed(0)+'px');
     node.style.setProperty('--hx',(Math.cos(angle)*distance*.6).toFixed(0)+'px');
     node.style.setProperty('--hy',((Math.sin(angle)*distance-27)*.6).toFixed(0)+'px');
     node.style.setProperty('--dur',rand(1.65,2.3).toFixed(2)+'s');
     parent.appendChild(node);node.addEventListener('animationend',()=>node.remove(),{once:true});
   }
   const ripple=document.createElement('div');ripple.className='ripple';
   ripple.style.setProperty('--x',x+'px');ripple.style.setProperty('--y',y+'px');
   parent.appendChild(ripple);ripple.addEventListener('animationend',()=>ripple.remove(),{once:true});
 }
 function burst(x,y){
   if(state.paused || state.hidden)return;
   const now=performance.now();if(now-state.lastBurst<220)return;
   state.lastBurst=now;
   const count=state.lite?26:48;
   for(let i=0;i<count&&particles.length<130;i++){
     const angle=rand(0,6.283),v=rand(40,200);
     particles.push({x,y,vx:Math.cos(angle)*v,vy:Math.sin(angle)*v-34,age:0,
       life:rand(.7,1.3),r:rand(2.8,6.5),t:Math.random(),heart:Math.random()<.68});
   }
   popWords(x,y);
   $('loveText').textContent=wishes[wishIndex%wishes.length];wishIndex++;
   $('loveCard').classList.add('show');clearTimeout(cardTimer);
   cardTimer=setTimeout(()=>$('loveCard').classList.remove('show'),3100);
   // Rung phản hồi rất ngắn nếu điện thoại có hỗ trợ, không bắt buộc.
   if(navigator.vibrate&&!reduced)try{navigator.vibrate(16)}catch(_e){}
   start();
 }
 function render(now){
   state.raf=0;
   if(state.hidden||state.paused)return;
   start();
   if(now-state.last<1000/state.fps-.75)return;
   const dt=clamp((now-(state.last||now))/1000,0,.055);state.last=now;
   const dx=state.tx-state.rx,dy=state.ty-state.ry;
   if(Math.abs(dx)+Math.abs(dy)>.03){
     state.rx+=dx*.18;state.ry+=dy*.18;
     tilt.style.transform=`rotateX(${state.rx.toFixed(2)}deg) rotateY(${state.ry.toFixed(2)}deg)`;
   }
   drawSky(now);drawParticles(dt);
 }
 function start(){if(!state.raf&&!state.hidden&&!state.paused)state.raf=requestAnimationFrame(render)}
 function stop(){if(state.raf)cancelAnimationFrame(state.raf);state.raf=0;state.last=0}
 window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(size,140)},{passive:true});
 let pointer=null;
 scene.addEventListener('pointerdown',e=>{
   if(e.button!==undefined&&e.button!==0)return;
   pointer={x:e.clientX,y:e.clientY,moved:false};
   if(scene.setPointerCapture)try{scene.setPointerCapture(e.pointerId)}catch(_e){}
 },{passive:true});
 scene.addEventListener('pointermove',e=>{
   if(state.sensorOn && state.sensorSeen)return;
   if(e.pointerType!=='mouse'&&!pointer)return;
   if(pointer&&Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>11)pointer.moved=true;
   const r=rect||scene.getBoundingClientRect();
   // Rê chuột trên PC hoặc kéo ngón tay trên điện thoại để xoay theo 2 trục.
   state.ty=clamp(((e.clientX-r.left)/r.width-.5)*43,-23,23);
   state.tx=clamp(-((e.clientY-r.top)/r.height-.5)*36,-19,19);
 },{passive:true});
 scene.addEventListener('pointerup',e=>{
   if(pointer&&!pointer.moved)burst(e.clientX,e.clientY);
   pointer=null;
   if(!(state.sensorOn&&state.sensorSeen)&&e.pointerType!=='mouse'){state.tx=0;state.ty=0}
 },{passive:true});
 scene.addEventListener('pointercancel',()=>{pointer=null;if(!state.sensorSeen){state.tx=0;state.ty=0}},{passive:true});
 scene.addEventListener('pointerleave',()=>{if(!pointer&&!state.sensorSeen){state.tx=0;state.ty=0}},{passive:true});
 scene.addEventListener('keydown',e=>{
   if(e.key==='Enter'||e.key===' '){e.preventDefault();const r=scene.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2)}
 });
 // Cảm biến định hướng: hiệu chỉnh tại thời điểm bật, có xử lý xoay ngang màn hình.
 function angleNow(){return screen.orientation&&typeof screen.orientation.angle==='number'?screen.orientation.angle:(typeof window.orientation==='number'?window.orientation:0)}
 function orientation(e){
   if(!state.sensorOn||e.beta==null||e.gamma==null)return;
   const angle=angleNow();let lr,ud;
   if(angle===90||angle===-270){lr=e.beta;ud=-e.gamma}
   else if(angle===270||angle===-90){lr=-e.beta;ud=e.gamma}
   else if(angle===180||angle===-180){lr=-e.gamma;ud=-e.beta}
   else{lr=e.gamma;ud=e.beta}
   if(!state.sensorZero||state.sensorAngle!==angle){state.sensorZero={lr,ud};state.sensorAngle=angle}
   state.sensorSeen=true;
   state.ty=clamp((lr-state.sensorZero.lr)*.78,-24,24);
   state.tx=clamp(-(ud-state.sensorZero.ud)*.65,-20,20);
 }
 function sensorOff(){
   removeEventListener('deviceorientation',orientation);
   clearTimeout(sensorTimer);state.sensorOn=false;state.sensorSeen=false;
   state.sensorZero=null;state.tx=0;state.ty=0;
   $('motionButton').setAttribute('aria-pressed','false');$('motionLabel').textContent='Nghiêng 3D';
 }
 // Android thường cho phép cảm biến tự hoạt động khi website chạy qua HTTPS.
 // iPhone/iPad thường yêu cầu nhấn nút để cấp quyền; luôn giữ cách kéo tay dự phòng.
 function autoSensor(){
   if(!mobile||!isSecureContext||!('DeviceOrientationEvent' in window)||
      typeof DeviceOrientationEvent.requestPermission==='function')return;
   state.sensorOn=true;state.sensorZero=null;state.sensorSeen=false;
   addEventListener('deviceorientation',orientation,{passive:true});
   $('motionButton').setAttribute('aria-pressed','true');$('motionLabel').textContent='Đang nghiêng';
   sensorTimer=setTimeout(()=>{if(state.sensorOn&&!state.sensorSeen)sensorOff()},4000);
 }
 $('motionButton').addEventListener('click',async()=>{
   if(state.sensorOn){sensorOff();toast('Đã tắt cảm biến. Hãy kéo tim để xoay 3D.');return}
   if(!('DeviceOrientationEvent' in window)) {toast('Thiết bị không hỗ trợ cảm biến; vẫn xoay được bằng tay.');return}
   if(!isSecureContext){toast('Cảm biến cần mở website qua HTTPS. Bạn vẫn có thể kéo tim bằng tay.');return}
   try{
     if(typeof DeviceOrientationEvent.requestPermission==='function'){
       const allowed=await DeviceOrientationEvent.requestPermission();
       if(allowed!=='granted'){toast('Chưa cấp quyền cảm biến. Bạn vẫn có thể kéo tim.');return}
     }
     state.sensorOn=true;state.sensorSeen=false;state.sensorZero=null;
     addEventListener('deviceorientation',orientation,{passive:true});
     $('motionButton').setAttribute('aria-pressed','true');$('motionLabel').textContent='Đang nghiêng';
     toast('Đã bật! Nghiêng điện thoại để xoay trái tim ❤️');
     sensorTimer=setTimeout(()=>{
       if(state.sensorOn&&!state.sensorSeen){sensorOff();toast('Không nhận được cảm biến. Thử HTTPS bằng Chrome/Safari.');}
     },4200);
   }catch(_e){sensorOff();toast('Trình duyệt không cho phép dùng cảm biến. Hãy thử HTTPS.');}
 });

 // ===== Nhạc MP3 (đổi tên file ở dòng bên dưới) =====
 const bgMusic = new Audio('SECRET.mp3');
 bgMusic.loop = true;
 bgMusic.volume = 0.7;
 bgMusic.preload = 'none';

 function musicOff(){
   state.audioOn = false;
   bgMusic.pause();
   $('musicButton').setAttribute('aria-pressed','false');
   $('musicLabel').textContent = 'Bật nhạc';
 }

 function resumeMusic(){
   if(!state.audioOn || state.paused || state.hidden)return;
   bgMusic.play().catch(()=>{
     musicOff();
     toast('Không thể tiếp tục phát MP3. Kiểm tra file nhạc.');
   });
 }

 $('musicButton').addEventListener('click',async()=>{
   if(state.audioOn){musicOff();return;}
   if(state.paused){
     toast('Hãy nhấn Tiếp tục trước khi bật nhạc.');
     return;
   }

   try{
     await bgMusic.play();
     state.audioOn = true;
     if(state.hidden || state.paused)bgMusic.pause();

     $('musicButton').setAttribute('aria-pressed','true');
     $('musicLabel').textContent = 'Tắt nhạc';
     toast('Đã bật nhạc tình yêu Vũ ♥ Quyên ♫');
   }catch(_e){
     musicOff();
     toast('Không phát được MP3. Đặt nhac.mp3 cạnh file HTML.');
   }
 });

 $('qualityButton').addEventListener('click',()=>{
   state.lite=!state.lite;quality();
   toast(state.lite?'Đang tiết kiệm tài nguyên để giảm lag.':'Đã bật hiệu ứng đẹp.');
 });
 $('pauseButton').addEventListener('click',()=>{
   state.paused=!state.paused;document.body.classList.toggle('paused',state.paused);
   $('pauseButton').setAttribute('aria-pressed',String(state.paused));
   $('pauseIcon').textContent=state.paused?'▶':'Ⅱ';$('pauseLabel').textContent=state.paused?'Tiếp tục':'Tạm dừng';
   if(state.paused){stop();particles.length=0;fxCtx&&fxCtx.clearRect(0,0,state.w,state.h);
     if(state.audioOn&&audioCtx)audioCtx.suspend().catch(()=>{});
   } else {start();if(state.audioOn&&audioCtx)audioCtx.resume().then(()=>{nextNote=audioCtx.currentTime+.06}).catch(()=>{})}
 });
 document.addEventListener('visibilitychange',()=>{
   state.hidden=document.hidden;
   if(state.hidden)stop();else start();
   if(state.audioOn&&audioCtx){
     if(state.hidden)audioCtx.suspend().catch(()=>{});
     else if(!state.paused)audioCtx.resume().then(()=>{nextNote=audioCtx.currentTime+.06}).catch(()=>{});
   }
 });
 quality();start();autoSensor();
 if(!skyCtx||!fxCtx)toast('Trình duyệt này không hỗ trợ Canvas. Vui lòng thử Chrome/Safari/Edge mới nhất.');
 // Không tự bùng nổ khi tải trang: hiệu ứng lời thương chỉ kích hoạt khi chạm.
})();
</script>
