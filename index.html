
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vũ ❤️ Quyên</title>

<style>
:root {
  --pink: #ff73bc;
  --light: #ffe0f1;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse at 50% 43%,
      #35102f 0%, #14091e 35%, #05030c 75%);
  font-family: Arial, sans-serif;
  touch-action: pan-y;
}

.scene {
  position: relative;
  width: min(96vw, 720px);
  aspect-ratio: 1;
  perspective: 1000px;
  isolation: isolate;
}

.aura {
  position: absolute;
  width: 65%;
  height: 60%;
  left: 17.5%;
  top: 17%;
  border-radius: 50%;
  background: #fd208f;
  opacity: .14;
  filter: blur(70px);
  animation: aura 3s ease-in-out infinite alternate;
  pointer-events: none;
}

.tilt {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform .2s ease-out;
}

.heart {
  width: 100%;
  height: 100%;
  overflow: visible;
  filter: drop-shadow(0 0 12px #ff2a96);
  animation: beat 2.4s ease-in-out infinite;
}

.heart-shape {
  fill: none;
  stroke: #ff3c9e;
  stroke-width: 1.5;
  opacity: .27;
  filter: drop-shadow(0 0 8px #ff69b4);
}

.heart-text {
  font-family: Arial, sans-serif;
  font-weight: 700;
  fill: #ffc5e4;
  stroke: #ff459f;
  stroke-width: .25px;
  paint-order: stroke;
  text-shadow:
    0 0 3px #ff66b1,
    0 0 7px #ff3299;
}

.outer {
  font-size: 17px;
}

.middle {
  font-size: 15px;
  fill: #ff91c9;
}

.inner {
  font-size: 13px;
  fill: #ffd6eb;
}

.center {
  position: absolute;
  left: 50%;
  top: 51%;
  width: 58%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  animation: float 4s ease-in-out infinite;
}

.center .mini {
  font-size: clamp(10px, 2vw, 14px);
  letter-spacing: 3px;
  color: #ffc4e3;
  text-shadow: 0 0 10px #ff3d9c;
}

.center h1 {
  margin: 12px 0 5px;
  font-size: clamp(26px, 6vw, 49px);
  font-family: Georgia, serif;
  font-style: italic;
  color: #ffe2f1;
  text-shadow:
    0 0 5px #fff,
    0 0 15px #ff66b5,
    0 0 30px #ff1688;
}

.center .message {
  margin: 8px 0;
  font-size: clamp(12px, 2.8vw, 19px);
  font-weight: bold;
  color: #ffb6dd;
  text-shadow: 0 0 10px #ff3999;
}

.center .symbol {
  margin-top: 8px;
  font-size: 33px;
  color: #ff74b8;
  text-shadow: 0 0 22px #ff0080;
  animation: beat 1.5s ease-in-out infinite;
}

.spark {
  position: absolute;
  border-radius: 50%;
  background: white;
  box-shadow:
    0 0 7px white,
    0 0 14px #ff55b0;
  pointer-events: none;
  animation: twinkle var(--duration) ease-in-out infinite;
  animation-delay: var(--delay);
}

.floating-heart {
  position: fixed;
  bottom: -30px;
  color: #ff81c2;
  pointer-events: none;
  text-shadow: 0 0 12px #ff2c97;
  opacity: 0;
  animation: rise var(--time) linear infinite;
  animation-delay: var(--delay);
}

/* Hiệu ứng tim đập */
@keyframes beat {
  0%, 100% { transform: scale(1); }
  45% { transform: scale(1.035); }
  60% { transform: scale(1.01); }
  75% { transform: scale(1.045); }
}

/* Ánh sáng neon */
@keyframes aura {
  from {
    opacity: .12;
    transform: scale(.9);
  }
  to {
    opacity: .3;
    transform: scale(1.2);
  }
}

/* Chữ chính giữa bay nhẹ */
@keyframes float {
  0%, 100% {
    transform: translate(-50%, -50%) translateY(0);
  }
  50% {
    transform: translate(-50%, -50%) translateY(-8px);
  }
}

/* Sao nhấp nháy */
@keyframes twinkle {
  0%, 100% {
    opacity: .15;
    transform: scale(.6);
  }
  50% {
    opacity: 1;
    transform: scale(1.5);
  }
}

/* Trái tim nhỏ bay */
@keyframes rise {
  0% {
    transform: translateY(0) rotate(-15deg);
    opacity: 0;
  }
  15% { opacity: .8; }
  85% { opacity: .6; }
  100% {
    transform: translateY(-110dvh) rotate(25deg);
    opacity: 0;
  }
}

/* 3D tự động cho điện thoại */
@keyframes mobile3D {
  0%, 100% {
    transform: rotateY(-10deg) rotateX(4deg);
  }
  50% {
    transform: rotateY(10deg) rotateX(-4deg);
  }
}

/* Tối ưu cho điện thoại */
@media (max-width: 600px) {
  .scene {
    width: min(100vw, 440px);
  }

  .tilt {
    animation: mobile3D 6s ease-in-out infinite;
    transition: none;
  }

  .aura {
    filter: blur(40px);
  }

  .heart {
    filter: drop-shadow(0 0 8px #ff2a96);
  }

  .center {
    width: 55%;
  }

  .center h1 {
    font-size: clamp(21px, 6vw, 30px);
    margin: 6px 0;
  }

  .center .mini {
    font-size: 9px;
    letter-spacing: 1.5px;
  }

  .center .message {
    font-size: clamp(10px, 2.7vw, 13px);
    margin: 5px 0;
  }

  .center .symbol {
    font-size: 25px;
    margin-top: 4px;
  }
}

/* Tôn trọng cài đặt giảm chuyển động */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<div class="scene" id="scene">
  <div class="aura"></div>

  <div class="tilt" id="tilt">
    <svg class="heart"
         viewBox="0 0 700 700"
         xmlns="http://www.w3.org/2000/svg">

      <defs>
        <path id="path1"/>
        <path id="path2"/>
        <path id="path3"/>
      </defs>

      <!-- Viền 3 trái tim -->
      <use href="#path1" class="heart-shape"/>
      <use href="#path2" class="heart-shape"/>
      <use href="#path3" class="heart-shape"/>

      <!-- Chữ chạy theo đường viền -->
      <text class="heart-text outer">
        <textPath href="#path1" id="text1"></textPath>
      </text>

      <text class="heart-text middle">
        <textPath href="#path2" id="text2"></textPath>
      </text>

      <text class="heart-text inner">
        <textPath href="#path3" id="text3"></textPath>
      </text>

    </svg>
  </div>

  <div class="center">
    <div class="mini">Forever Love</div>
    <h1>Vũ &amp; Quyên</h1>
    <div class="message">Vũ yêu vợ Quyên</div>
    <div class="message">nhìu lắm &lt;3</div>
    <div class="symbol">♥</div>
  </div>
</div>

<script>
const message = "Vũ yêu vợ Quyên nhìu lắm <3";
const scene = document.getElementById("scene");

// Tạo hình trái tim
function createHeart(scale) {
  const points = [];

  for (let i = 0; i <= 500; i++) {
    const t = (i / 500) * Math.PI * 2;

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
      13 * Math.cos(t)
      - 5 * Math.cos(2 * t)
      - 2 * Math.cos(3 * t)
      - Math.cos(4 * t);

    const px = 350 + x * 14 * scale;
    const py = 350 - y * 14 * scale;

    points.push(
      `${i === 0 ? "M" : "L"} ${px.toFixed(2)} ${py.toFixed(2)}`
    );
  }

  return points.join(" ") + " Z";
}

// Đặt chữ trên đường viền trái tim
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

function addText(pathId, textId, scale, size) {
  const path = document.getElementById(pathId);
  const textPath = document.getElementById(textId);

  path.setAttribute("d", createHeart(scale));

  const length = path.getTotalLength();

  ctx.font = `bold ${size}px Arial`;

  const phrase = message + "   ♡   ";
  const phraseWidth = ctx.measureText(phrase).width;

  const count = Math.max(
    1,
    Math.floor((length - 35) / phraseWidth)
  );

  textPath.textContent = phrase.repeat(count);

  textPath.setAttribute("textLength", length - 30);
  textPath.setAttribute("lengthAdjust", "spacing");
}

addText("path1", "text1", 1.0, 17);
addText("path2", "text2", 0.82, 15);
addText("path3", "text3", 0.65, 13);

// Tạo sao lấp lánh
const isMobile = window.matchMedia(
  "(max-width: 600px)"
).matches;

// Giảm số hạt trên điện thoại để chạy mượt
const starCount = isMobile ? 35 : 65;

for (let i = 0; i < starCount; i++) {
  const star = document.createElement("span");
  star.className = "spark";

  const size = Math.random() * 2.5 + 1;

  star.style.width = size + "px";
  star.style.height = size + "px";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";

  star.style.setProperty(
    "--duration",
    (Math.random() * 3 + 1.5) + "s"
  );

  star.style.setProperty(
    "--delay",
    (Math.random() * -5) + "s"
  );

  scene.appendChild(star);
}

// Tạo trái tim nhỏ bay lên
const floatingCount = isMobile ? 12 : 16;

for (let i = 0; i < floatingCount; i++) {
  const smallHeart = document.createElement("span");
  smallHeart.className = "floating-heart";
  smallHeart.textContent = "♥";

  smallHeart.style.left = Math.random() * 100 + "%";

  smallHeart.style.fontSize =
    (Math.random() * 12 + 9) + "px";

  smallHeart.style.setProperty(
    "--time",
    (Math.random() * 7 + 7) + "s"
  );

  smallHeart.style.setProperty(
    "--delay",
    (Math.random() * -14) + "s"
  );

  document.body.appendChild(smallHeart);
}

// Hiệu ứng 3D khi di chuột trên máy tính
const tilt = document.getElementById("tilt");

const hasMouse = window.matchMedia(
  "(hover: hover) and (pointer: fine)"
).matches;

if (hasMouse) {
  scene.addEventListener("mousemove", (e) => {
    const rect = scene.getBoundingClientRect();

    const x =
      (e.clientX - rect.left) / rect.width - 0.5;

    const y =
      (e.clientY - rect.top) / rect.height - 0.5;

    tilt.style.transform = `
      rotateY(${x * 8}deg)
      rotateX(${-y * 8}deg)
    `;
  });

  scene.addEventListener("mouseleave", () => {
    tilt.style.transform =
      "rotateX(0deg) rotateY(0deg)";
  });
}

// 3D tự động trên thiết bị cảm ứng màn hình lớn
if (!hasMouse && !isMobile) {
  tilt.style.animation =
    "mobile3D 6s ease-in-out infinite";
}
</script>

</body>
</html>
