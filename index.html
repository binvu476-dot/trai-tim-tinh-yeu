
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vũ ❤️ Quyên</title>

<style>
:root {
  --pink: #ff73bc;
  --light: #ffe0f1;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse at 50% 43%,
      #35102f 0%, #14091e 35%, #05030c 75%),
    #05030c;
  font-family: Arial, sans-serif;
}

.scene {
  position: relative;
  width: min(96vw, 720px);
  aspect-ratio: 1;
  perspective: 1000px;
}

.aura {
  position: absolute;
  width: 65%;
  height: 60%;
  left: 17.5%;
  top: 17%;
  border-radius: 50%;
  background: #fd208f;
  opacity: .14;
  filter: blur(85px);
  animation: aura 3s ease-in-out infinite alternate;
}

.tilt {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform .2s ease-out;
}

.heart {
  width: 100%;
  height: 100%;
  overflow: visible;
  filter: drop-shadow(0 0 15px #ff2a96);
  animation: beat 2.4s ease-in-out infinite;
}

.heart-shape {
  fill: none;
  stroke: #ff3c9e;
  stroke-width: 1.5;
  opacity: .27;
  filter: drop-shadow(0 0 12px #ff69b4);
}

.heart-text {
  font-family: Arial, sans-serif;
  font-weight: 700;
  fill: #ffc5e4;
  paint-order: stroke;
  stroke: #ff459f;
  stroke-width: .35px;
  text-shadow:
    0 0 4px #ff66b1,
    0 0 9px #ff3299;
}

.outer {
  font-size: 17px;
}

.middle {
  font-size: 15px;
  fill: #ff91c9;
  opacity: .95;
}

.inner {
  font-size: 13px;
  fill: #ffd6eb;
  opacity: .85;
}

.center {
  position: absolute;
  left: 50%;
  top: 51%;
  width: 65%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  animation: float 4s ease-in-out infinite;
}

.center .mini {
  font-size: clamp(11px, 2vw, 14px);
  letter-spacing: 4px;
  color: #ffc4e3;
  text-transform: uppercase;
  text-shadow: 0 0 10px #ff3d9c;
}

.center h1 {
  margin: 12px 0 5px;
  font-size: clamp(30px, 6vw, 49px);
  font-family: Georgia, serif;
  font-style: italic;
  color: #ffe2f1;
  text-shadow:
    0 0 5px #fff,
    0 0 15px #ff66b5,
    0 0 35px #ff1688;
}

.center .message {
  margin: 8px 0;
  font-size: clamp(13px, 2.8vw, 19px);
  font-weight: bold;
  color: #ffb6dd;
  text-shadow: 0 0 10px #ff3999;
}

.center .symbol {
  margin-top: 8px;
  font-size: 33px;
  color: #ff74b8;
  text-shadow: 0 0 22px #ff0080;
  animation: beat 1.5s ease-in-out infinite;
}

.spark {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  box-shadow:
    0 0 8px #fff,
    0 0 18px #ff55b0;
  pointer-events: none;
  animation: twinkle var(--duration) ease-in-out infinite;
  animation-delay: var(--delay);
}

.floating-heart {
  position: absolute;
  bottom: -30px;
  color: #ff81c2;
  pointer-events: none;
  text-shadow: 0 0 12px #ff2c97;
  opacity: 0;
  animation: rise var(--time) linear infinite;
  animation-delay: var(--delay);
}

@keyframes beat {
  0%, 100% { transform: scale(1); }
  45% { transform: scale(1.035); }
  60% { transform: scale(1.01); }
  75% { transform: scale(1.045); }
}

@keyframes aura {
  from { opacity: .12; transform: scale(.9); }
  to { opacity: .27; transform: scale(1.2); }
}

@keyframes float {
  0%, 100% {
    transform: translate(-50%, -50%) translateY(0);
  }
  50% {
    transform: translate(-50%, -50%) translateY(-8px);
  }
}

@keyframes twinkle {
  0%, 100% { opacity: .15; transform: scale(.6); }
  50% { opacity: 1; transform: scale(1.5); }
}

@keyframes rise {
  0% {
    transform: translateY(0) rotate(-15deg);
    opacity: 0;
  }
  15% { opacity: .8; }
  85% { opacity: .6; }
  100% {
    transform: translateY(-110vh) rotate(25deg);
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .heart,
  .center,
  .spark,
  .floating-heart {
    animation-duration: 8s;
  }
}
@media (hover: none) and (pointer: coarse) {
  .tilt {
    animation: phoneRotate 6s ease-in-out infinite;
  }

  .heart {
    animation: beat 2s ease-in-out infinite;
  }
}

@keyframes phoneRotate {
  0%, 100% {
    transform: rotateY(-12deg) rotateX(5deg);
  }
  50% {
    transform: rotateY(12deg) rotateX(-5deg);
  }
}
</style>
</head>

<body>

<div class="scene" id="scene">
  <div class="aura"></div>

  <div class="tilt" id="tilt">
    <svg class="heart" viewBox="0 0 700 700"
         xmlns="http://www.w3.org/2000/svg">

      <defs>
        <path id="path1"/>
        <path id="path2"/>
        <path id="path3"/>
      </defs>

      <!-- Ba đường viền trái tim -->
      <use href="#path1" class="heart-shape"/>
      <use href="#path2" class="heart-shape"/>
      <use href="#path3" class="heart-shape"/>

      <!-- Chữ nằm dọc đường viền -->
      <text class="heart-text outer">
        <textPath href="#path1" id="text1"></textPath>
      </text>

      <text class="heart-text middle">
        <textPath href="#path2" id="text2"></textPath>
      </text>

      <text class="heart-text inner">
        <textPath href="#path3" id="text3"></textPath>
      </text>
    </svg>
  </div>

  <!-- Chữ chính giữa -->
  <div class="center">
    <div class="mini">Forever Love</div>
    <h1>Vũ & Quyên</h1>
    <div class="message">
      Vũ yêu vợ Quyên
    </div>
    <div class="message">
      nhìu lắm &lt;3
    </div>
    <div class="symbol">♥</div>
  </div>
</div>

<script>
const message = "Vũ yêu vợ Quyên nhìu lắm <3";
const scene = document.getElementById("scene");

// Hàm tạo hình trái tim chuẩn
function createHeart(scale) {
  const points = [];

  for (let i = 0; i <= 500; i++) {
    const t = (i / 500) * Math.PI * 2;

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
      13 * Math.cos(t)
      - 5 * Math.cos(2 * t)
      - 2 * Math.cos(3 * t)
      - Math.cos(4 * t);

    const px = 350 + x * 14 * scale;
    const py = 350 - y * 14 * scale;

    points.push(
      `${i === 0 ? "M" : "L"} ${px.toFixed(2)} ${py.toFixed(2)}`
    );
  }

  return points.join(" ") + " Z";
}

// Đo chữ để không chồng lên nhau
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

function addText(pathId, textId, scale, size) {
  const path = document.getElementById(pathId);
  const textPath = document.getElementById(textId);

  path.setAttribute("d", createHeart(scale));

  const length = path.getTotalLength();

  ctx.font = `bold ${size}px Arial`;

  const phrase = message + "   ♡   ";
  const phraseWidth = ctx.measureText(phrase).width;

  // Số câu vừa với chu vi trái tim
  const count = Math.max(
    1,
    Math.floor((length - 35) / phraseWidth)
  );

  textPath.textContent = phrase.repeat(count);

  // Chỉ nới khoảng cách chữ, không kéo méo chữ
  textPath.setAttribute("textLength", length - 30);
  textPath.setAttribute("lengthAdjust", "spacing");
}

// Ba lớp chữ rõ ràng, không đè lên nhau
addText("path1", "text1", 1.0, 17);
addText("path2", "text2", 0.82, 15);
addText("path3", "text3", 0.65, 13);

// Tạo sao lấp lánh
for (let i = 0; i < 65; i++) {
  const star = document.createElement("span");
  star.className = "spark";

  const size = Math.random() * 2.5 + 1;

  star.style.width = size + "px";
  star.style.height = size + "px";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";

  star.style.setProperty(
    "--duration",
    (Math.random() * 3 + 1.5) + "s"
  );

  star.style.setProperty(
    "--delay",
    (Math.random() * -5) + "s"
  );

  scene.appendChild(star);
}

// Trái tim nhỏ bay lên
for (let i = 0; i < 16; i++) {
  const smallHeart = document.createElement("span");
  smallHeart.className = "floating-heart";
  smallHeart.textContent = "♥";

  smallHeart.style.left = Math.random() * 100 + "%";
  smallHeart.style.fontSize =
    (Math.random() * 12 + 9) + "px";

  smallHeart.style.setProperty(
    "--time",
    (Math.random() * 7 + 7) + "s"
  );

  smallHeart.style.setProperty(
    "--delay",
    (Math.random() * -14) + "s"
  );

  document.body.appendChild(smallHeart);
}

// Hiệu ứng chiều sâu khi di chuột
const tilt = document.getElementById("tilt");

scene.addEventListener("mousemove", (e) => {
  const rect = scene.getBoundingClientRect();

  const x = (e.clientX - rect.left) / rect.width - 0.5;
  const y = (e.clientY - rect.top) / rect.height - 0.5;

  tilt.style.transform = `
    rotateY(${x * 8}deg)
    rotateX(${-y * 8}deg)
  `;
});

scene.addEventListener("mouseleave", () => {
  tilt.style.transform = "rotateX(0deg) rotateY(0deg)";
});
</script>

</body>
</html>
